<!doctype html>
<html><head><meta charset="utf-8"><title>Port Isaac art renderer</title>
<style>body{margin:0;background:#222}canvas{display:block;max-width:100%}</style></head>
<body>
<!-- Dev tool: renders the comic-style loading screen cards from the player model.
     Open /tools/art.html?card=0 in the dev server; window.__art holds the JPEG data URL. -->
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { Player } from '/src/player.js';
import { Car } from '/src/vehicles.js';

const W = 1920, H = 1080;
const card = +(new URLSearchParams(location.search).get('card') || 0);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const gltf = await new Promise((r) => loader.load('/models/player.gltf.json', r));
const extra = (await (await fetch('/anims/extra.json')).json()).map((j) => THREE.AnimationClip.parse(j));

/* ---------- toon look: cel shading + inverted-hull ink outline */
const grad = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]), 3, 1);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
function inkify(root, width = 0.012) {
  const meshes = [];
  root.traverse((o) => { if (o.isMesh) meshes.push(o); });
  for (const o of meshes) {
    const src = Array.isArray(o.material) ? o.material[0] : o.material;
    const toon = new THREE.MeshToonMaterial({ map: src.map || null, color: src.map ? 0xffffff : src.color, gradientMap: grad, vertexColors: !!src.vertexColors });
    if (src.transparent) { toon.transparent = true; toon.opacity = src.opacity; }
    o.material = toon;
    const ink = new THREE.MeshBasicMaterial({ color: 0x0d0710, side: THREE.BackSide });
    const skinned = o.isSkinnedMesh;
    ink.onBeforeCompile = (s) => {
      s.vertexShader = s.vertexShader.replace('#include <skinning_vertex>', `#include <skinning_vertex>\n transformed += normalize(${skinned ? 'objectNormal' : 'normal'}) * ${width.toFixed(4)};`);
    };
    ink.customProgramCacheKey = () => 'ink' + skinned + width;
    let outline;
    if (o.isSkinnedMesh) { outline = new THREE.SkinnedMesh(o.geometry, ink); outline.bind(o.skeleton, o.bindMatrix); }
    else outline = new THREE.Mesh(o.geometry, ink);
    outline.frustumCulled = false;
    if (o.morphTargetInfluences) outline.morphTargetInfluences = o.morphTargetInfluences;
    o.add(outline);
  }
}

/* ---------- painted backgrounds */
function sky(g, stops, sunX, sunY, sunR, rays = true) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  stops.forEach(([t, c]) => gr.addColorStop(t, c));
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (rays) {
    g.save(); g.translate(sunX, sunY); g.globalAlpha = 0.13; g.fillStyle = '#fff8d8';
    for (let i = 0; i < 18; i++) { g.rotate(Math.PI / 9); g.beginPath(); g.moveTo(0, 0); g.lineTo(2400, -110); g.lineTo(2400, 110); g.fill(); }
    g.restore();
  }
  const sg = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR);
  sg.addColorStop(0, '#fffbe0'); sg.addColorStop(0.5, '#ffd36b'); sg.addColorStop(1, 'rgba(255,170,80,0)');
  g.fillStyle = sg; g.beginPath(); g.arc(sunX, sunY, sunR, 0, Math.PI * 2); g.fill();
}
function skyline(g, y, color, seed, hmin, hmax) {
  let s = seed; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  g.fillStyle = color;
  for (let x = -20; x < W + 40;) {
    const w = 40 + r() * 90, h = hmin + r() * (hmax - hmin);
    g.fillRect(x, y - h, w, h + 400);
    if (r() < 0.3) g.fillRect(x + w * 0.4, y - h - 40, 6, 40);
    x += w + 4;
  }
}
function palm(g, x, y, h, color, lean = 0.2, s = 1) {
  g.strokeStyle = color; g.fillStyle = color; g.lineCap = 'round';
  g.lineWidth = 16 * s;
  const tx = x + lean * h, ty = y - h;
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * h * 0.2, y - h * 0.6, tx, ty); g.stroke();
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + (i - 3.5) * 0.45;
    const len = (130 + (i % 3) * 30) * s;
    g.lineWidth = 9 * s;
    g.beginPath(); g.moveTo(tx, ty);
    g.quadraticCurveTo(tx + Math.cos(a) * len * 0.6, ty + Math.sin(a) * len * 0.6 - 40 * s, tx + Math.cos(a) * len, ty + Math.sin(a) * len + 60 * s);
    g.stroke();
  }
}
function speedLines(g, cx, cy, color) {
  g.save(); g.strokeStyle = color; g.globalAlpha = 0.35;
  for (let i = 0; i < 70; i++) {
    const a = Math.random() * Math.PI * 2, r0 = 380 + Math.random() * 200, r1 = r0 + 300 + Math.random() * 900;
    g.lineWidth = 2 + Math.random() * 6;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0); g.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); g.stroke();
  }
  g.restore();
}

/* ---------- comic finish: posterise + halftone shadows + grain */
function finish(canvas) {
  const g = canvas.getContext('2d');
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    for (let k = 0; k < 3; k++) d[i + k] = Math.round(d[i + k] / 255 * 7) / 7 * 255;
    const l = (d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11) / 255;
    // halftone dots in the mid/dark tones (45 deg screen)
    const u = (x + y) * 0.7071, v = (x - y) * 0.7071, p = 7;
    const fx = (u % p) / p - 0.5, fy = (((v % p) + p) % p) / p - 0.5;
    const r = Math.sqrt(fx * fx + fy * fy);
    if (l < 0.55 && r < (0.55 - l) * 0.9) for (let k = 0; k < 3; k++) d[i + k] *= 0.72;
    const n = (Math.random() - 0.5) * 14;
    for (let k = 0; k < 3; k++) d[i + k] = Math.max(0, Math.min(255, d[i + k] + n));
  }
  g.putImageData(img, 0, 0);
}

/* ---------- 3D */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
scene.add(new THREE.HemisphereLight(0xfff0e0, 0x6a3a6a, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.6); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xff8a50, 2.0); rim.position.set(-4, 2, -4); scene.add(rim);

const player = new Player(gltf, extra, scene);
inkify(player.model, 0.011);
inkify(player.gun, 0.006);
function pose(name, t, facing = 0) {
  player.mixer.stopAllAction(); player.current = null;
  const a = player.actions[name]; a.reset().play(); a.time = t; a.setEffectiveWeight(1);
  player.mixer.update(0);
  player.root.position.set(0, 0, 0); player.root.rotation.set(0, facing, 0); player.facing = facing;
  player.model.updateMatrixWorld(true);
}

const out = document.createElement('canvas'); out.width = W; out.height = H; document.body.appendChild(out);
const g = out.getContext('2d');

function useBackground() {
  const t = new THREE.CanvasTexture(out); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
function draw3D(cx = 0, cy = 0, sw = W, sh = H, clip) {
  renderer.render(scene, camera);
  g.save();
  if (clip) { g.beginPath(); clip.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.clip(); }
  g.drawImage(renderer.domElement, cx, cy, sw, sh);
  g.restore();
}

if (card === 0) {
  // THE HUSTLER: low-angle hero shot aiming the carbine at sunset
  sky(g, [[0, '#2a0f4a'], [0.45, '#c2367a'], [0.75, '#ff8a3d'], [1, '#ffd36b']], 1350, 620, 260);
  skyline(g, 900, '#4a1a52', 3, 60, 340);
  palm(g, 1650, 1080, 620, '#1d0b22', -0.15, 1.3); palm(g, 1820, 1080, 480, '#1d0b22', -0.25, 1.0); palm(g, 140, 1080, 560, '#1d0b22', 0.2, 1.1);
  pose('gunIdle', 0.8, -0.35);
  player.aiming = false; player.current = 'gunIdle'; player.updateGun(true, { aimPitch: () => 0 }); player.gun.visible = true;
  camera.fov = 26; camera.updateProjectionMatrix();
  camera.position.set(-0.7, 0.5, 4.0); camera.lookAt(0.3, 1.05, 0);
  useBackground(); draw3D();
} else if (card === 1) {
  // THE RIDE: behind the wheel of a gold Razor GT, speed lines, neon dusk
  sky(g, [[0, '#0f1a4a'], [0.5, '#5b2a86'], [0.8, '#ff4f8b'], [1, '#ffb26b']], 960, 760, 300, false);
  speedLines(g, 960, 560, '#ffe9f6');
  skyline(g, 700, '#24123f', 11, 120, 460);
  // road in perspective
  g.fillStyle = '#1a1424'; g.fillRect(0, 690, W, H - 690);
  g.fillStyle = '#ffc21a';
  for (let k = 0; k < 9; k++) { const t0 = k / 9, t1 = (k + 0.5) / 9; const y0 = 690 + (t0 ** 2) * 400, y1 = 690 + (t1 ** 2) * 400; const w0 = 3 + t0 * 30, w1 = 3 + t1 * 30; g.beginPath(); g.moveTo(960 - w0, y0); g.lineTo(960 + w0, y0); g.lineTo(960 + w1 * 1.0 + (t1 - t0) * 0, y1); g.lineTo(960 - w1, y1); g.fill(); }
  g.strokeStyle = '#e8d8ff'; g.lineWidth = 6; g.globalAlpha = 0.5;
  g.beginPath(); g.moveTo(860, 690); g.lineTo(-200, H); g.moveTo(1060, 690); g.lineTo(2120, H); g.stroke(); g.globalAlpha = 1;
  const car = new Car('sports', scene, 0xffc21a);
  car.place(0, 0, 0); car.sync(0);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 5.2).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.55 })); sh.position.y = 0.01; scene.add(sh);
  inkify(car.group, 0.02);
  // sitting on the hood, legs over the front bumper
  pose('sit', 1.0, 0.25);
  player.root.position.set(0.05, 0.08, 1.75); player.gun.visible = false;
  camera.fov = 32; camera.updateProjectionMatrix();
  camera.position.set(3.2, 0.9, 6.0); camera.lookAt(0.1, 0.85, 0.4);
  car.group.traverse((o) => { if (o.isMesh && o.material.transparent) { o.material.opacity = 0.42; o.material.depthWrite = false; } });
  useBackground(); draw3D();
} else {
  // TRIPTYCH: three tilted comic panels
  g.fillStyle = '#0d0710'; g.fillRect(0, 0, W, H);
  const panels = [
    { poly: [[0, 0], [760, 0], [620, H], [0, H]], bg: [[0, '#13a3c9'], [1, '#ffe08a']], anim: 'wave', t: 0.9, face: -0.4, cam: [[0.2, 1.45, 2.3], [0.0, 1.35, 0]], fov: 30 },
    { poly: [[780, 0], [1400, 0], [1290, 520], [700, 520]], bg: [[0, '#ff3d6e'], [1, '#ffb347']], anim: 'punchR', t: 0.35, face: 0.6, cam: [[0.3, 1.3, 2.6], [0.05, 1.25, 0]], fov: 34 },
    { poly: [[690, 545], [1285, 545], [1180, H], [640, H]], bg: [[0, '#2bd68a'], [1, '#13505e']], anim: 'sprint', t: 0.3, face: 1.2, cam: [[0.4, 1.1, 3.4], [0, 0.95, 0]], fov: 36 },
    { poly: [[1420, 0], [W, 0], [W, H], [1205, H]], bg: [[0, '#7a2bd9'], [1, '#ff6ad5']], anim: 'kick', t: 0.75, face: -1.0, cam: [[-0.2, 1.0, 4.2], [0.1, 1.0, 0]], fov: 34 },
  ];
  for (const p of panels) {
    const xs = p.poly.map((q) => q[0]), ys = p.poly.map((q) => q[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    g.save(); g.beginPath(); p.poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.clip();
    const gr = g.createLinearGradient(x0, y0, x1, y1); p.bg.forEach(([t, c]) => gr.addColorStop(t, c));
    g.fillStyle = gr; g.fillRect(x0, y0, x1 - x0, y1 - y0);
    speedLines(g, (x0 + x1) / 2, (y0 + y1) / 2, '#ffffff');
    g.restore();
    pose(p.anim, p.t, p.face);
    camera.fov = p.fov; camera.aspect = (x1 - x0) / (y1 - y0); camera.updateProjectionMatrix();
    camera.position.set(...p.cam[0]); camera.lookAt(...p.cam[1]);
    renderer.setSize(x1 - x0, y1 - y0, false);
    draw3D(x0, y0, x1 - x0, y1 - y0, p.poly);
  }
  // thick gutters
  g.strokeStyle = '#0d0710'; g.lineWidth = 22;
  for (const p of panels) { g.beginPath(); p.poly.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.stroke(); }
}
finish(out);
// vignette
const vg = g.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, H * 1.05);
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,0,20,0.55)');
g.fillStyle = vg; g.fillRect(0, 0, W, H);
window.__art = out.toDataURL('image/jpeg', 0.86);
</script>
</body></html>
